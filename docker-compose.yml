version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bis_backend
    ports:
      - "8000:8000"
    environment:
      # You can override variables here or use a .env file
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      - qdrant
    networks:
      - bis_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bis_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bis_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bis_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - bis_network
    restart: unless-stopped

networks:
  bis_network:
    driver: bridge

volumes:
  qdrant_data:
